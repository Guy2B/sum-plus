name: GitHub Pages

# Publishes the local-first web app to https://<owner>.github.io/<repo>/ on every
# push to main. The Firebase web config comes from apps/web/.env.production;
# optional legal/support VITE_* repository variables override it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w apps/web
      - name: Build for the Pages sub-path
        run: npm run build -w apps/web
        env:
          # Custom domain (Settings → Pages): served at the root of next.algbr.eu.
          VITE_BASE: /
          VITE_PUBLIC_URL: https://next.algbr.eu
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
