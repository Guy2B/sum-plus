version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      firebase: { patterns: ['firebase', 'firebase-*', '@firebase/*'] }
      tooling: { patterns: ['eslint*', 'typescript*', 'vite*', 'vitest', '@playwright/*', 'prettier'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
