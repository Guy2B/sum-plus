# Σ connector API on Netlify Functions (free tier). The web app itself is on
# GitHub Pages / Firebase Hosting; this site only serves /api/*.
[build]
  publish = "netlify/public"
  command = "echo 'API only'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "firebase-functions", "imapflow"]

# Anonymous analytics (free tier scheduled functions, UTC).
[functions."analytics-aggregate"]
  schedule = "0 */3 * * *"

[functions."analytics-daily"]
  schedule = "0 5 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
